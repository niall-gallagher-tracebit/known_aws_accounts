on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate YAML
    runs-on: ubuntu-latest
    steps:
      - name: Issue credentials
        uses: tracebit-com/tracebit-github-action@main
        with:
          customer-id: ${{ vars.SECURITY_CUSTOMER_ID }}
          api-token: ${{ secrets.SECURITY_API_TOKEN }}
          profile: administrator-123
          profile-region: eu-west-1
      - name: Checkout Repository
        uses: actions/checkout@v2
      - name: Install dependencies
        run: sudo snap install --edge check-jsonschema && sudo snap install yq
      - name: Validate accounts.yaml
        run: ./validate.sh